name: Build Windows
on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (errors fail the job, style hints do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-windows:
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip release folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath EchoMusic-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-Windows
          path: EchoMusic-Windows.zip
